    <style>
      /* Page preloader: painted before any JS, removed when fonts, app and 3D model are ready */
      html,body{background:#0a0b0e;margin:0}
      noscript main{max-width:40rem;margin:4rem auto;padding:0 1.25rem;color:#f2f4f8;font-family:system-ui,sans-serif;line-height:1.5}
      noscript a{color:#19b4ff}
      html.is-loading,html.is-loading body{overflow:hidden;height:100%}
      #preloader{position:fixed;inset:0;z-index:1000;display:grid;place-content:center;justify-items:center;gap:22px;background:#0a0b0e;color:#f2f4f8;transition:opacity .6s ease .1s,visibility 0s linear .7s}
      #preloader.is-done{opacity:0;visibility:hidden}
      #preloader svg{width:84px;height:120px;overflow:visible}
      #preloader .pl-line{fill:none;stroke:#23262e;stroke-width:2}
      #preloader .pl-fill{fill:rgba(31,107,255,.28);transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(var(--p,.06));transition:transform .45s ease}
      #preloader .pl-star{fill:#19b4ff;animation:pl-pulse 1.4s ease-in-out infinite}
      #preloader .pl-brand{height:30px;width:auto;display:block}
      #preloader .pl-bar{width:160px;height:2px;background:#23262e;border-radius:2px;overflow:hidden}
      #preloader .pl-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#1a2be0,#19b4ff);transform-origin:left;transform:scaleX(var(--p,.06));transition:transform .45s ease}
      #preloader .pl-text{font:400 .75rem/1 "IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#6f7685;font-variant-numeric:tabular-nums;min-height:1em}
      #preloader.is-done .pl-star{animation:none}
      @keyframes pl-pulse{50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce){#preloader .pl-star{animation:none}#preloader,#preloader *{transition:none!important}}
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-live="polite">

        <path class="pl-star" d="M60 46l3.2 6.6 7.2.9-5.3 5 1.4 7.1L60 62.1l-6.5 3.5 1.4-7.1-5.3-5 7.2-.9z" />

      <div class="pl-text">Učitavam…</div>
    </div>
    <script>
      // Tiny controller the app reports to: progress(0-100) while loading, done() when the page is ready.
      (function () {
        var el = document.getElementById('preloader'), txt = el.querySelector('.pl-text'), shown = 6, finished = false
        function set(p) { shown = Math.max(shown, Math.min(100, p)); el.style.setProperty('--p', (shown / 100).toFixed(3)); txt.textContent = shown >= 100 ? 'Spremno' : 'Učitavam · ' + Math.round(shown) + '%' }
        function done() {
          if (finished) return; finished = true; set(100)
          setTimeout(function () {
            el.classList.add('is-done'); document.documentElement.classList.remove('is-loading')
            window.dispatchEvent(new Event('preloader:done'))
            setTimeout(function () { el.remove() }, 900)
          }, 180)
        }
        window.__preloader = { progress: set, done: done, get finished() { return finished } }
        // never trap visitors behind the loader
        setTimeout(done, 15000)
      })()
    </script>
